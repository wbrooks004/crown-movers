<!-- @dsCard group="Sections" height=520 subtitle="Ink surface, crown-notch form card (WS Form on the site)" -->
<div class="surface surface--ink"><div class="quote-panel">
  <div class="quote-panel__content"><span class="eyebrow">Free quote</span><h2>Get your moving quote</h2><p class="section-header__intro">Tell us where and when. A coordinator calls you back with a written price. [VERIFY copy]</p>
    <ul class="quote-panel__trust"><li>Licensed and insured [VERIFY]</li><li>No hidden fees [VERIFY]</li><li>Local and long-distance</li></ul></div>
  <form class="quote-panel__form" onsubmit="return false" aria-label="Quote request preview">
    <div class="field-row"><div class="field"><label for="q-from">Moving from</label><input id="q-from" placeholder="Postal code"></div><div class="field"><label for="q-to">Moving to</label><input id="q-to" placeholder="Postal code"></div></div>
    <div class="field-row"><div class="field"><label for="q-date">Move date</label><input id="q-date" type="date"></div><div class="field"><label for="q-size">Home size</label><select id="q-size"><option>1 bedroom</option><option>2 bedrooms</option><option>3+ bedrooms</option></select></div></div>
    <button class="btn btn--primary" type="submit">Get my quote <span class="btn__arrow" aria-hidden="true">→</span></button>
  </form>
</div></div>
